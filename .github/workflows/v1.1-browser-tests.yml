name: Al Edu V1.1 browser regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [v1.1-device-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    name: ${{ matrix.browser }} regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/al-edu-server.log 2>&1 &
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/al-edu-server.log
          exit 1
      - name: Run browser regression tests
        run: node tests/e2e.mjs ${{ matrix.browser }}
